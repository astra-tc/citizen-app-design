<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Settings | Kognai</title>
  <link rel="stylesheet" href="../tokens/tokens.css">
  <link rel="stylesheet" href="app.css">
  <script src="app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="app">
    <header class="topbar">
      <img class="avatar sm" src="assets/mark.svg" alt="Kognai" width="36" height="36">
      <h1>Settings</h1>
      <button class="icon-btn" type="button" data-toggle-theme aria-label="Switch light or dark"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/></svg></button>
      <a class="icon-btn" href="ar/settings.html" lang="ar" aria-label="Switch to Arabic"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></a>
    </header>
    <main id="main">

      <section class="card" aria-labelledby="h-prof">
        <h2 class="h3" id="h-prof">Citizen</h2>
        <div class="field"><label for="s-name">Citizen name</label><input class="input" id="s-name" value="Nour"></div>
      </section>
      <section class="card" aria-labelledby="h-app">
        <h2 class="h3" id="h-app">Appearance</h2>
        <fieldset>
          <legend class="label">Theme</legend>
          <div class="segmented"><label><input type="radio" name="theme" value="system" checked><span>System</span></label><label><input type="radio" name="theme" value="light"><span>Light</span></label><label><input type="radio" name="theme" value="dark"><span>Dark</span></label></div>
        </fieldset>
        <div class="field"><label for="s-lang">Language</label><select class="input" id="s-lang"><option selected>English</option><option>Arabic</option></select></div>
        <a class="small" href="ar/settings.html" lang="ar">العربية</a>
        <div class="field"><label for="s-size">Text size</label><select class="input" id="s-size"><option>Default</option><option>Large</option><option>Extra large</option></select></div>
      </section>
      <section class="card" aria-labelledby="h-n">
        <h2 class="h3" id="h-n">Notifications</h2>
        <label class="switch" for="n0"><span>Replies from my citizen</span><input type="checkbox" role="switch" id="n0" checked></label>
        <label class="switch" for="n1"><span>Payouts and top ups</span><input type="checkbox" role="switch" id="n1" checked></label>
        <label class="switch" for="n2"><span>Weekly summary</span><input type="checkbox" role="switch" id="n2"></label>
      </section>
      <section class="card" aria-labelledby="h-p">
        <h2 class="h3" id="h-p">Privacy and safety</h2>
        <label class="switch" for="p0"><span>Let my citizen remember our chats</span><input type="checkbox" role="switch" id="p0" checked></label>
        <label class="switch" for="p1"><span>Ask before any spend over 50 credits</span><input type="checkbox" role="switch" id="p1" checked></label>
        <a href="first-run.html">Read the Five Laws</a>
        <button class="btn btn-secondary btn-block" type="button">Export my data</button>
        <button class="btn btn-danger btn-block" type="button">Reset my citizen</button>
      </section>
      <p class="small muted">Prototype version 0.1</p>
      <p class="small muted"><a href="index.html">All screens</a></p>
    </main>
    <nav class="tabbar" aria-label="Main">
      <a href="lobby.html"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg><span>Lobby</span></a>
      <a href="chat.html"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Chat</span></a>
      <a href="services.html"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg><span>Services</span></a>
      <a href="wallet.html"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg><span>Wallet</span></a>
      <a href="settings.html" aria-current="page"><svg class="icon " viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span>Settings</span></a>
    </nav>
  </div>
</body>
</html>
